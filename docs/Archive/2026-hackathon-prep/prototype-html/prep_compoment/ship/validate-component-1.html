es":""}];

const CAT_COLORS = { 1: '#60a5fa', 2: '#f87171', 3: '#f472b6', 4: '#c084fc', 5: '#4ade80', 6: '#fb923c', 99: '#94a3b8' };
const CAT_LABELS = { 1: '音樂', 2: '戲劇', 3: '舞蹈', 4: '展覽', 5: '親子', 6: '市集', 99: '其他' };

let currentCity = 'Metro-Taipei';
let currentCat = 'all';
let currentTime = 'all';
let aiCollapsed = false;
let map, popup;

// ─── MAPBOX ───
// 使用 Carto Dark Matter 免費底圖磚（無需有效 Mapbox token 做底圖）
// Mapbox GL JS 仍使用中（合規），只換掉底圖 tile source
mapboxgl.accessToken = '<YOUR_MAPBOX_ACCESS_TOKEN>';

map = new mapboxgl.Map({
  container: 'map',
  style: {
    version: 8,
    glyphs: 'https://fonts.openmaptiles.org/{fontstack}/{range}.pbf',
    sources: {
      'carto-dark': {
        type: 'raster',
        tiles: [
          'https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png',
          'https://b.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png',
          'https://c.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png'
        ],
        tileSize: 256,
        attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors © <a href="https://carto.com/attributions">CARTO</a>'
      }
    },
    layers: [{
      id: 'carto-dark-tiles',
      type: 'raster',
      source: 'carto-dark',
      minzoom: 0,
      maxzoom: 20
    }]
  },
  center: [121.525, 25.055],
  zoom: 10.5
});

map.addControl(new mapboxgl.NavigationControl(), 'top-right');

popup = new mapboxgl.Popup({ closeButton: false, closeOnClick: false });

map.on('load', () => {
  initMapSources();
  renderAll();
  initChart();
  generateAIInsight();
  document.getElementById('updateTime').textContent = '更新: ' + new Date().toLocaleTimeString('zh-TW', {hour:'2-digit',minute:'2-digit'});
});

function initMapSources() {
  map.addSource('events', { type: 'geojson', data: buildGeoJSON([]) });

  map.addLayer({
    id: 'events-circles',
    type: 'circle',
    source: 'events',
    paint: {
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 9, 6, 14, 12],
      'circle-color': ['get', 'color'],
      'circle-opacity': 0.85,
      'circle-stroke-width': 1.5,
      'circle-stroke-color': 'rgba(255,255,255,0.25)'
    }
  });

  map.on('click', 'events-circles', (e) => {
    const props = e.features[0].properties;
    const coord = e.features[0].geometry.coordinates;
    popup.setLngLat(coord)
      .setHTML(`
        <div class="popup-title">${props.title}</div>
        <div class="popup-venue">📍 ${props.venue}</div>
        <div class="popup-time">🕐 ${props.time}</div>
        ${props.webSales ? `<a class="popup-link" href="${props.webSales}" target="_blank">購票連結 →</a>` : ''}
      `)
      .addTo(map);
  });

  map.on('mouseenter', 'events-circles', () => { map.getCanvas().style.cursor = 'pointer'; });
  map.on('mouseleave', 'events-circles', () => { map.getCanvas().style.cursor = ''; popup.remove(); });
}

function buildGeoJSON(events) {
  return {
    type: 'FeatureCollection',
    features: events.map(e => ({
      type: 'Feature',
      geometry: { type: 'Point', coordinates: [e.lng, e.lat] },
      properties: {
        id: e.id, title: e.title, city: e.city,
        venue: e.venue, time: e.time,
        category: e.category,
        color: CAT_COLORS[e.category] || CAT_COLORS[99],
        webSales: e.webSales || ''
      }
    }))
  };
}

function filterEvents() {
  return ALL_EVENTS.filter(e => {
    if (currentCity === 'Taipei' && e.city !== '台北') return false;
    if (currentCat !== 'all' && String(e.category) !== String(currentCat)) return false;
    return true;
  });
}

function renderAll() {
  const events = filterEvents();
  const taipeiCount = events.filter(e => e.city === '台北').length;
  const xinbeiCount = events.filter(e => e.city === '新北').length;

  if (map.getSource('events')) {
    map.getSource('events').setData(buildGeoJSON(events));
  }

  document.getElementById('statTaipei').textContent = taipeiCount;
  document.getElementById('statXinbei').textContent = xinbeiCount;
  document.getElementById('statTotal').textContent = events.length;

  document.getElementById('kpiTaipei').textContent = taipeiCount;
  document.getElementById('kpiXinbei').textContent = currentCity === 'Taipei' ? '—' : xinbeiCount;
  document.getElementById('kpiTotal').textContent = events.length;

  updateChart(events);
}

// ─── APEXCHARTS BAR ───
let chart;

function initChart() {
  const opts = buildChartOpts(filterEvents());
  chart = new ApexCharts(document.getElementById('barChart'), opts);
  chart.render();
}

function buildChartOpts(events) {
  const cats = [1, 2, 3, 4, 5];
  const labMap = { 1:'音樂', 2: '戲劇', 3: '舞蹈', 4: '展覽', 5: '親子' };
  const taipeiData = cats.map(c => events.filter(e => e.city === '台北' && e.category === c).length);
  const xinbeiData = cats.map(c => events.filter(e => e.city === '新北' && e.category === c).length);

  return {
    series: [
      { name: '台北市', data: taipeiData },
      { name: '新北市', data: xinbeiData }
    ],
    chart: {
      type: 'bar',
      height: 170,
      toolbar: { show: false },
      background: 'transparent',
      animations: { enabled: true, easing: 'easeinout', speed: 600 }
    },
    plotOptions: {
      bar: { horizontal: false, columnWidth: '55%', borderRadius: 3, grouped: true }
    },
    colors: ['#818cf8', '#34d399'],
    dataLabels: { enabled: false },
    xaxis: {
      categories: cats.map(c => labMap[c]),
      labels: { style: { colors: '#8888aa', fontSize: '11px' } },
      axisBorder: { show: false },
      axisTicks: { show: false }
    },
    yaxis: {
      labels: { style: { colors: '#8888aa', fontSize: '10px' } }
    },
    grid: {
      borderColor: 'rgba(255,255,255,0.06)',
      xaxis: { lines: { show: false } }
    },
    legend: {
      labels: { colors: '#8888aa' },
      fontSize: '11px',
      markers: { radius: 2, width: 8, height: 8 }
    },
    tooltip: {
      theme: 'dark',
      style: { fontSize: '12px' }
    }
  };
}

function updateChart(events) {
  if (!chart) return;
  const cats = [1, 2, 3, 4, 5];
  const taipeiData = cats.map(c => events.filter(e => e.city === '台北' && e.category === c).length);
  const xinbeiData = cats.map(c => events.filter(e => e.city === '新北' && e.category === c).length);
  chart.updateSeries([{ name: '台北市', data: taipeiData }, { name: '新北市', data: xinbeiData }]);
}

// ─── CONTROLS ───
function switchCity(city) {
  currentCity = city;
  if (city === 'Taipei') {
    map.flyTo({ center: [121.520, 25.045], zoom: 11.5 });
  } else {
    map.flyTo({ center: [121.525, 25.055], zoom: 10.5 });
  }
  renderAll();
  generateAIInsight();
}

function setTimeFilter(val, btn) {
  document.querySelectorAll('.time-filter .filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentTime = val;
  renderAll();
}

function toggleCat(cat, btn) {
  currentCat = cat;
  document.querySelectorAll('#typeFilters .filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderAll();
}

function toggleAI() {
  aiCollapsed = !aiCollapsed;
  document.getElementById('aiBody').classList.toggle('collapsed', aiCollapsed);
  document.getElementById('aiArrow').classList.toggle('open', !aiCollapsed);
}

// ─── AI INSIGHT (mock — real would call /api/v1/ai/chat/twai) ───
function generateAIInsight() {
  const events = filterEvents();
  const taiwan = events.filter(e => e.city === '台北').length;
  const xinbei = events.filter(e => e.city === '新北').length;
  const musicCount = events.filter(e => e.category === 1).length;
  const exhibitCount = events.filter(e => e.category === 4).length;
  const cityLabel = currentCity === 'Taipei' ? '台北市' : '雙北';

  const msg = `${cityLabel}目前共有 <strong>${events.length}</strong> 場藝文活動。
${currentCity !== 'Taipei' ? `台北市 <strong>${taiwan}</strong> 場（音樂、展覽為主），新北市有 <strong>${xinbei}</strong> 場活動——音樂類佔比較高（板橋、淡水核心舉辦中）。` : ''}
音樂類共 <strong>${musicCount}</strong> 場，佔比最高；展覽類 <strong>${exhibitCount}</strong> 場，多數可免費入場。
<br/><br/>
<em>🎯 建議關注：</em> 大稻埕廣場戶外音樂會（免費, 4/26）、板橋435親子工作坊（免費, 4/19）。
${ currentCity !== 'Taipei' ? `<br/><strong>⚠️ 新北活動數量較台北少 ${Math.round((1 - xinbei/taiwan)*100)}%</strong>，板橋、中和地區尚有擴展空間。` : '' }`;

  document.getElementById('aiResponse').innerHTML = msg;
}

function askAI() {
  const input = document.getElementById('aiInput').value.trim();
  if (!input) return;
  const events = filterEvents();
  const taiwan = events.filter(e => e.city === '台北').length;
  const xinbei = events.filter(e => e.city === '新北').length;
  const freeEvents = events.filter(e => e.onSales === 'N').length;
  document.getElementById('aiResponse').innerHTML =
    `<em>查詢：「${input}」</em><br/><br/>` +
    `根據目前 ${events.length} 場活動資料，其中 <strong>${freeEvents}</strong> 場免費入場（onSales=N）。
    台北市 <strong>${taiwan}</strong> 場，新北市 <strong>${xinbei}</strong> 場。<br/><br/>
    <em>（真實 AI 回應需啟動 Go 後端並呼叫 /api/v1/ai/chat/twai，目前為預覽模式）</em>`;
  document.getElementById('aiInput').value = '';
}

function handleKey(e) { if (e.key === 'Enter') askAI(); }
</script>
