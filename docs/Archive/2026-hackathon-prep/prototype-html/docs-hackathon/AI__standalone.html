document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ound: rgba(90,156,248,.08); }\n.w-card-icon { font-size: 22px; }\n.w-card-name { font-size: 12.5px; font-weight: 600; }\n.w-card-hint { font-size: 10px; color: var(--color-complement-text); text-align: center; line-height: 1.4; }\n.w-start {\n  margin-top: 20px;\n  padding: 9px 32px; border-radius: 6px;\n  background: var(--color-highlight); color: #fff;\n  border: none; font-family: var(--font-family);\n  font-size: 13.5px; font-weight: 700;\n  cursor: pointer; transition: all .14s;\n  display: none; letter-spacing: .02em;\n}\n.w-start.show { display: inline-block; }\n.w-start:hover { background: #7ab0fb; }\n\n/* ═══════════════════════════════════════════\n   MESSAGES\n═══════════════════════════════════════════ */\n.messages { display: flex; flex-direction: column; gap: 14px; }\n.messages.hidden { display: none; }\n\n.msg { display: flex; gap: 9px; align-items: flex-start; }\n.msg.user { flex-direction: row-reverse; }\n\n.avatar {\n  width: 34px; height: 34px; border-radius: 8px;\n  display: flex; align-items: center; justify-content: center;\n  flex-shrink: 0; font-size: 15px;\n  border: 1px solid var(--color-border);\n}\n.avatar.ai   { background: rgba(90,156,248,.15); border-color: rgba(90,156,248,.3); }\n.avatar.user { background: rgba(255,255,255,.06); }\n\n.bubble {\n  max-width: 74%; padding: 11px 14px;\n  border-radius: var(--radius); line-height: 1.65; font-size: 14px;\n}\n.msg.ai .bubble {\n  background: var(--color-component-background);\n  border: 1px solid var(--color-border);\n  border-radius: 2px 10px 10px 10px;\n}\n.msg.user .bubble {\n  background: rgba(90,156,248,.12);\n  border: 1px solid rgba(90,156,248,.25);\n  border-radius: 10px 2px 10px 10px;\n}\n\n/* ═══════════════════════════════════════════\n   TOOL CALL STEPS\n═══════════════════════════════════════════ */\n.tool-steps { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }\n.tool-step {\n  display: flex; align-items: center; gap: 8px;\n  padding: 6px 10px; border-ra compare_dual_city',       label: '比對雙北公共運輸分擔率', result: '台北公共運輸分擔率 52.3%，新北 38.7%。但台北汽機車存量仍達 157 萬輛。' },\n    ],\n    cards: [\n      { label: '捷運路線尖峰擁擠度', stats: [{ v:'208萬', u:'/日', k:'日均運量' }, { v:'52.3%', u:'', k:'公運分擔率' }, { v:'138%', u:'', k:'板南線擁擠度' }],\n        bars: [{l:'板南線',v:88,c:'#FF4444'},{l:'文湖線',v:79,c:'#FF8800'},{l:'淡水線',v:72,c:'#FF8800'},{l:'中和線',v:58,c:'#5a9cf8'}] },\n    ],\n    followups: ['板南線壅塞的解決方案？','哪些區域最缺乏公共運輸？','幫我生成交通洞察摘要'],\n    pkData: [\n      { m:'公共運輸分擔率',  tp:'52.3%',     nt:'38.7%',      better:'tp' },\n      { m:'捷運日均運量',    tp:'208萬人次', nt:'45萬人次',    better:'tp' },\n      { m:'私有運具數量',    tp:'157萬輛',   nt:'198萬輛',     better:'tp' },\n      { m:'尖峰主幹道時速',  tp:'14km/h',    nt:'18km/h',      better:'nt' },\n    ],\n  },\n};\n\n// ═══════════════════════════════════════════\n// STATE\n// ═══════════════════════════════════════════\nlet currentTopic = null;\nlet loading = false;\nlet history = [];\nlet session = 'S-' + Math.random().toString(36).slice(2,6).toUpperCase();\ndocument.getElementById('sessionTag').textContent = 'session · ' + session;\n\n// ═══════════════════════════════════════════\n// TOPIC SELECTION\n// ═══════════════════════════════════════════\nfunction pickTopic(key, btn) {\n  currentTopic = key;\n  document.querySelectorAll('.topic-btn').forEach(b => b.classList.toggle('active', b === btn));\n  document.querySelectorAll('.w-card').forEach(c => c.classList.toggle('active', c.dataset.topic === key));\n  document.getElementById('wStart').classList.add('show');\n  document.getElementById('topicCrumb').textContent = TOPICS[key].name;\n}\nfunction pickTopicCard(card, key) {\n  currentTopic = key;\n  document.querySelectorAll('.w-card').forEach(c => c.classList.toggle('active', c === card));\n  document.querySelectorAll('.topic-btn').forEach(b => b.classList.toggle('active', b.dataset.topic === key));\n  document.getElementById('wStart').classList.add('show');\n  document.getElementById('topicCrumb').textContent = TOPICS[key].name;\n}\nfunction startExplore() {\n  if (!currentTopic) return;\n  hideWelcome();\n  appendUser(TOPICS[currentTopic].openMsg);\n  runExploration(currentTopic);\n}\nfunction hideWelcome() {\n  document.getElementById('welcome').classList.add('hidden');\n  document.getElementById('messages').classList.remove('hidden');\n}\n\n// ═══════════════════════════════════════════\n// EXPLORATION FLOW\n// ═══════════════════════════════════════════\nasync function runExploration(key) {\n  const T = TOPICS[key];\n  loading = true; setBtnDisabled(true);\n\n  const msgs = document.getElementById('messages');\n\n  // Create AI message container\n  const aiEl = document.createElement('div');\n  aiEl.className = 'msg ai';\n  aiEl.innerHTML = `<div class=\"avatar ai\">✦<\u002Fdiv>`;\n  const bubble = document.createElement('div');\n  bubble.className = 'bubble';\n  aiEl.appendChild(bubble);\n  msgs.appendChild(aiEl);\n  scroll();\n\n  // 1. Tool call steps\n  const stepsDiv = document.createElement('div');\n  stepsDiv.className = 'tool-steps';\n  bubble.appendChild(stepsDiv);\n\n  for (let i = 0; i < T.tools.length; i++) {\n    const t = T.tools[i];\n    const row = document.createElement('div');\n    row.className = 'tool-step running';\n    row.innerHTML = `<div class=\"ts-spin\"><\u002Fdiv><span class=\"ts-text\">${t.label}<\u002Fspan><span class=\"ts-fn\">${t.fn}()<\u002Fspan>`;\n    stepsDiv.appendChild(row);\n    scroll();\n    await wait(850 + i * 380);\n    row.className = 'tool-step done';\n    row.innerHTML = `<span class=\"ts-check\">✓<\u002Fspan><span class=\"ts-text\">${t.label}<\u002Fspan><span class=\"ts-fn\">${t.fn}()<\u002Fspan>`;\n  }\n  await wait(250);\n\n  // 2. Data cards\n  for (const dc of T.cards) {\n    const card = makeDataCard(dc);\n    bubble.appendChild(card);\n    requestAnimationFrame(() => {\n      card.querySelectorAll('.dc-bar-fill').forEach(f => {\n        const w = f.dataset.w; f.style.width = '0%';\n        setTimeout(() => { f.style.width = w; }, 80);\n      });\n    });\n    scroll();\n  }\n\n  // 3. AI narrative via Claude\n  const textDiv = document.createElement('div');\n  textDiv.className = 'ai-text';\n  bubble.appendChild(textDiv);\n\n  const toolCtx = T.tools.map(t => `[${t.fn}] ${t.result}`).join('\\n');\n  const sys = `你是臺北城市儀表板的 AI 城市導覽員 Nexus。你的任務是用簡單有力的繁體中文，把開放數據的洞察說給一般市民聽。\n\n已完成的工具調用結果：\n${toolCtx}\n\n回覆要求：\n- 直接進入洞察，不要開場白\n- 用 **粗體** 標示最關鍵的數字或區域\n- 2–3 段，每段聚焦一個核心洞察\n- 結尾自然收住，不要加客套語\n- 控制在 160 字以內`;\n\n  try {\n    const reply = await window.claude.complete({\n      system: sys,\n      messages: [{ role: 'user', content: T.openMsg }],\n    });\n    history.push({ role: 'assistant', content: reply });\n    await streamText(textDiv, reply);\n  } catch (e) {\n    // Fallback preset responses\n    const fallbacks = {\n      disaster: `台北市防災系統有一個不容忽視的**結構性缺口**：全市避難所覆蓋率僅 **63.5%**，文山缺口 4,820 人、萬華 3,960 人——意思是有近四成的需求找不到容身之所。\\n\\n風險最高的是**萬華區（87/100）**，地勢低窪加排水系統老化，150–200mm 降雨就會超過歷史均值 23%。\\n\\n更值得警覺的是跨區依賴問題：文山 **61%** 的緊急資源需要外區支援，一旦聯絡道路壅塞，整個應急鏈就會斷。`,\n      food:     `台北市 2024 食品稽查交出一份還不錯的成績單：合格率 **96.2%**，較去年提升 1.4%，背後是稽查頻率從 2.9 次提升到 **3.2 次/年**。\\n\\n但夜市攤販是最主要的漏洞。廣州街夜市違規 18 件最多，違規原因集中在**食品添加物超標（42%）**和**保存溫度不符（31%）**，後者在夏季特別危險。\\n\\n跟新北比，台北不合格率（3.8%）明顯優於新北（5.1%）。稽查資源的問題不在總量，在於**如何讓郊區和夜市的覆蓋更均勻**。`,\n      culture:  `台北有 **234 座**文化場館，每萬人 8.7 座，比新北市（5.2 座）高出近七成。但這個優勢高度集中在市中心——大安區密度是文山區的 **5.8 倍**。\\n\\n最直觀的體感指標是步行可達率：大安區市民有 **94%** 的人 15 分鐘內走得到文化設施，文山區只有 **58%**，同一座城市落差超過三十六個百分點。\\n\\n有意思的是，新北近三年場館新增速率達 +12%，是台北（+4%）的三倍——台北的文化設施數量領先，但**建設腳步正在被追上**。`,\n      health:   `台北有 **12,480 台** AED，步行 3 分鐘可達率 84.2%，大安區高達 96%，是全市最好。但萬華只有 **71%**，原因是老舊建築更新緩慢，AED 裝設點難以進入。\\n\\n急診的壓力更值得關注：仁愛醫院跨區承接率已達 **88%**，幾乎是外地病患專門來的。全市急診等待時間延長到 **42 分鐘**，比去年增加 8 分鐘。\\n\\n台北每萬人床位數（68.4）是新北（42.1）的 1.6 倍，但急診壅塞率（61%）反而更高——這說明**新北的病患大量湧入台北**，造成系統性失衡。`,\n      transport:`台北捷運每日運量 **208 萬人次**，公共運輸分擔率 52.3%，在全台無城市能及。但板南線尖峰擁擠度已達 **138%**，通勤體驗正在惡化。\\n\\n道路方面，忠孝東路尖峰時速僅 **14km/h**——幾乎等同快步行走的速度。信義計畫區停車需求超出容量 **340%**，是全市最嚴峻的熱點。\\n\\n台北私有運具存量仍達 157 萬輛，顯示大量市民**捷運加機車雙模式通勤**。末端 500 公尺的空白，是擴大公共運輸覆蓋最關鍵的最後一哩路。`,\n    };\n    await streamText(textDiv, fallbacks[key] || '數據載入中，請稍後再試。');\n  }\n\n  // 4. Follow-up suggestions\n  const fqDiv = document.createElement('div');\n  fqDiv.className = 'followups';\n  for (const s of T.followups) {\n    const b = document.createElement('button');\n    b.className = 'fq-btn'; b.textContent = s;\n    b.onclick = () => quickAsk(s);\n    fqDiv.appendChild(b);\n  }\n  bubble.appendChild(fqDiv);\n  scroll();\n\n  loading = false; setBtnDisabled(false);\n}\n\n// ═══════════════════════════════════════════\n// SEND MESSAGE\n// ═══════════════════════════════════════════\nfunction quickAsk(t) {\n  document.getElementById('userInput').value = t;\n  sendMsg();\n}\nasync function sendMsg() {\n  const inp = document.getElementById('userInput');\n  const text = inp.value.trim();\n  if (!text || loading) return;\n  inp.value = ''; autoSize(inp);\n  if (document.getElementById('welcome').classList.contains('hidden') === false) hideWelcome();\n  appendUser(text);\n\n  // Share / summary request\n  if (/分享|摘要|生成/.test(text)) { await doShare(text); return; }\n  // PK request\n  if (/雙城|PK|新北/.test(text)) { launchPK(); return; }\n\n  loading = true; setBtnDisabled(true);\n  history.push({ role: 'user', content: text });\n\n  const typEl = appendTyping();\n  const T = currentTopic ? TOPICS[currentTopic] : null;\n  const ctx = T ? T.tools.map(t => `[${t.fn}] ${t.result}`).join('\\n') : '';\n\n  try {\n    const reply = await window.claude.complete({\n      system: `你是臺北城市儀表板 AI 導覽員 Nexus。用繁體中文回答，精煉直接，130 字以內。${ctx ? '已知數據：' + ctx : ''}`,\n      messages: history,\n    });\n    history.push({ role: 'assistant', content: reply });\n    typEl.remove();\n    appendAI(reply);\n  } catch(e) {\n    typEl.remove();\n    appendAI('連線暫時中斷，請稍後再試。');\n  }\n  loading = false; setBtnDisabled(false);\n}\n\n// ═══════════════════════════════════════════\n// SHARE SUMMARY\n// ═══════════════════════════════════════════\nasync function doShare(userText) {\n  loading = true; setBtnDisabled(true);\n  const T = currentTopic ? TOPICS[currentTopic] : null;\n  const typEl = appendTyping();\n\n  const fallback = {\n    disaster: '台北市萬華區淹水風險指數 87/100，全市避難所覆蓋率僅 63.5%，文山缺口最大達 4,820 人。防災資源整合需要跨縣市協調！📊\\n#臺北城市儀表板 #數據說城市',\n    food:     '台北市 2024 食品稽查合格率達 96.2%，連續第三年進步！但夜市攤販仍是高風險點，添加物超標佔違規 42%。🍱\\n#臺北城市儀表板 #數據說城市',\n    culture:  '台北市 234 座文化場館，每萬人 8.7 座。但文山區步行可達率僅 58%，大安 94%——同一城市的文化落差值得關注。🏛️\\n#臺北城市儀表板 #數據說城市',\n    health:   '台北市 AED 覆蓋率 84.2%，但仁愛醫院急診跨區承接率高達 88%，平均等待時間增至 42 分鐘。醫療資源跨縣失衡需重視。🏥\\n#臺北城市儀表板 #數據說城市',\n    transport:'台北捷運板南線尖峰擁擠度 138%，忠孝東路時速跌至 14km/h。公共運輸分擔率 52.3%，末端「最後一哩」仍是最大挑戰。🚉\\n#臺北城市儀表板 #數據說城市',\n  };\n\n  let shareText = fallback[currentTopic] || '臺北城市儀表板——讓數據成為每個市民的城市探索夥伴。\\n#臺北城市儀表板 #數據說城市';\n\n  if (T) {\n    try {\n      shareText = await window.claude.complete({\n        system: `你是臺北城市儀表板 AI 導覽員。根據以下數據，生成適合社群媒體分享的繁體中文洞察。要求：80–100 字，有亮點數字，末尾加 #臺北城市儀表板 #數據說城市。數據：${T.tools.map(t=>t.result).join(' ')}`,\n        messages: [{ role: 'user', content: userText }],\n      });\n    } catch(e) { /* use fallback */ }\n  }\n\n  typEl.remove();\n\n  const aiEl = document.createElement('div');\n  aiEl.className = 'msg ai';\n  aiEl.innerHTML = `<div class=\"avatar ai\">✦<\u002Fdiv>`;\n  const bub = document.createElement('div');\n  bub.className = 'bubble';\n  bub.innerHTML = `<div class=\"ai-text\" style=\"margin-bottom:10px\">根據你的探索，整理了以下分享文字：<\u002Fdiv>`;\n\n  const sc = document.createElement('div');\n  sc.className = 'share-card';\n  sc.innerHTML = `\n    <div class=\"share-label\">📤 社群媒體分享文字<\u002Fdiv>\n    <div class=\"share-text\" id=\"stx\">${esc(shareText)}<\u002Fdiv>\n    <div class=\"share-acts\">\n      <button class=\"share-btn primary\" onclick=\"copyShare()\">複製文字<\u002Fbutton>\n      <button class=\"share-btn\" onclick=\"alert('截圖功能開發中')\">截圖分享<\u002Fbutton>\n      <button class=\"share-btn\" onclick=\"alert('LINE分享開發中')\">LINE 分享<\u002Fbutton>\n    <\u002Fdiv>`;\n  bub.appendChild(sc);\n  aiEl.appendChild(bub);\n  document.getElementById('messages').appendChild(aiEl);\n  scroll();\n\n  loading = false; setBtnDisabled(false);\n}\nfunction copyShare() {\n  const t = document.getElementById('stx')?.textContent;\n  if (t) navigator.clipboard.writeText(t).then(() => alert('已複製到剪貼簿！'));\n}\n\n// ═══════════════════════════════════════════\n// DUAL CITY PK\n// ═══════════════════════════════════════════\nfunction launchPK() {\n  if (!currentTopic) { alert('請先選擇一個探索主題，再使用雙城 PK 模式。'); return; }\n  hideWelcome();\n  const T = TOPICS[currentTopic];\n\n  appendUser(`開啟雙城 PK：台北 vs 新北 ／ ${T.name}`);\n\n  const aiEl = document.createElement('div');\n  aiEl.className = 'msg ai';\n  aiEl.innerHTML = `<div class=\"avatar ai\">✦<\u002Fdiv>`;\n  const bub = document.createElement('div');\n  bub.className = 'bubble';\n  bub.innerHTML = `<div class=\"ai-text\" style=\"margin-bottom:10px\">以下是台北市 vs 新北市的 <strong>${T.name}<\u002Fstrong> 關鍵指標對比──<\u002Fdiv>`;\n\n  const pk = document.createElement('div');\n  pk.className = 'pk-card';\n  pk.innerHTML = `\n    <div class=\"pk-header\">\n      <div class=\"pk-city tp\">🏙️ 台北市<\u002Fdiv>\n      <div class=\"pk-city nt\">🌆 新北市<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"pk-body\">${T.pkData.map(r => `\n      <div class=\"pk-row\">\n        <div class=\"pk-metric\">${r.m}<\u002Fdiv>\n        <div class=\"pk-val-tp\">${r.tp}${r.better==='tp'?' <span class=\"better tp\">▶<\u002Fspan>':''}<\u002Fdiv>\n        <div class=\"pk-val-nt\">${r.better==='nt'?'<span class=\"better nt\">◀<\u002Fspan> ':''}${r.nt}<\u002Fdiv>\n      <\u002Fdiv>`).join('')}\n    <\u002Fdiv>`;\n  bub.appendChild(pk);\n\n  const note = document.createElement('div');\n  note.style.cssText = 'font-size:10.5px;color:var(--color-complement-text);margin-top:8px';\n  note.textContent = '▶/◀ 表示該城市表現較佳　資料來源：臺北城市儀表板 3.0 雙北整合版';\n  bub.appendChild(note);\n\n  aiEl.appendChild(bub);\n  document.getElementById('messages').appendChild(aiEl);\n  scroll();\n}\n\n// ═══════════════════════════════════════════\n// DOM HELPERS\n// ═══════════════════════════════════════════\nfunction appendUser(text) {\n  const msgs = document.getElementById('messages');\n  const el = document.createElement('div');\n  el.className = 'msg user';\n  el.innerHTML = `<div class=\"avatar user\">人<\u002Fdiv><div class=\"bubble\">${esc(text)}<\u002Fdiv>`;\n  msgs.appendChild(el); scroll();\n}\nfunction appendAI(text) {\n  const msgs = document.getElementById('messages');\n  const el = document.createElement('div');\n  el.className = 'msg ai';\n  const bub = document.createElement('div');\n  bub.className = 'bubble';\n  bub.innerHTML = `<div class=\"ai-text\">${md(text)}<\u002Fdiv>`;\n  el.innerHTML = `<div class=\"avatar ai\">✦<\u002Fdiv>`;\n  el.appendChild(bub);\n  msgs.appendChild(el); scroll();\n}\nfunction appendTyping() {\n  const msgs = document.getElementById('messages');\n  const el = document.createElement('div');\n  el.className = 'msg ai';\n  el.innerHTML = `<div class=\"avatar ai\">✦<\u002Fdiv><div class=\"bubble\"><div class=\"typing\"><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fdiv><\u002Fdiv>`;\n  msgs.appendChild(el); scroll(); return el;\n}\nfunction makeDataCard(dc) {\n  const card = document.createElement('div');\n  card.className = 'data-card';\n  const statsH = dc.stats.map(s =>\n    `<div class=\"dc-stat\"><div><span class=\"dc-val\">${s.v}<\u002Fspan><span class=\"dc-unit\">${s.u}<\u002Fspan><\u002Fdiv><div class=\"dc-key\">${s.k}<\u002Fdiv><\u002Fdiv>`\n  ).join('');\n  const barsH = dc.bars ? `<div class=\"dc-bars\">${dc.bars.map(b =>\n    `<div class=\"dc-bar-row\">\n      <span class=\"dc-bar-lbl\">${b.l}<\u002Fspan>\n      <div class=\"dc-bar-track\"><div class=\"dc-bar-fill\" data-w=\"${b.v}%\" style=\"width:0%;background:${b.c}\"><\u002Fdiv><\u002Fdiv>\n      <span class=\"dc-bar-num\">${b.v}<\u002Fspan>\n    <\u002Fdiv>`).join('')}<\u002Fdiv>` : '';\n  card.innerHTML = `<div class=\"dc-head\"><div class=\"dc-dot\"><\u002Fdiv>${dc.label}<\u002Fdiv><div class=\"dc-stats\">${statsH}<\u002Fdiv>${barsH}`;\n  return card;\n}\nasync function streamText(el, text) {\n  el.innerHTML = '<span class=\"cursor\"><\u002Fspan>';\n  let out = '';\n  for (let i = 0; i < text.length; i++) {\n    out += text[i];\n    el.innerHTML = md(out) + '<span class=\"cursor\"><\u002Fspan>';\n    scroll();\n    await wait(text[i] === '\\n' ? 35 : (i % 4 === 0 ? 16 : 9));\n  }\n  el.innerHTML = md(text);\n}\nfunction md(t) {\n  return t\n    .replace(/\\*\\*(.*?)\\*\\*/g, '<strong>$1<\u002Fstrong>')\n    .replace(/(?<!\\*)\\*([^*\\n]+)\\*(?!\\*)/g, '<em>$1<\u002Fem>')\n    .replace(/\\n\\n/g, '<\u002Fp><p style=\"margin-top:8px\">')\n    .replace(/\\n/g, '<br>');\n}\nfunction esc(s) { return s.replace(/&/g,'&amp;').replace(/<\u002Fg,'&lt;').replace(/>/g,'&gt;'); }\nfunction scroll() { const w = document.getElementById('chatWrap'); requestAnimationFrame(() => { w.scrollTop = w.scrollHeight; }); }\nfunction setBtnDisabled(v) { document.getElementById('sendBtn').disabled = v; }\nfunction handleKey(e) { if (e.key==='Enter'&&!e.shiftKey) { e.preventDefault(); sendMsg(); } }\nfunction autoSize(el) { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,120)+'px'; }\nfunction wait(ms) { return new Promise(r => setTimeout(r, ms)); }\n\n// ═══════════════════════════════════════════\n// TWEAKS PROTOCOL\n// ═══════════════════════════════════════════\nwindow.addEventListener('message', e => {\n  if (e.data?.type === '__activate_edit_mode')   document.body.style.outline = '2px dashed rgba(90,156,248,.3)';\n  if (e.data?.type === '__deactivate_edit_mode') document.body.style.outline = '';\n});\nwindow.parent.postMessage({ type: '__edit_mode_available' }, '*');\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
